name: sigot_mobile
description: "SIGOT - Sistema de Gestión de Órdenes de Taller"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Íconos de la app (camión de marca SIGOT). Regenerar con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#0E1A2C"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  min_sdk_android: 21
