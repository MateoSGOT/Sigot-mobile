name: Build APK

# Compila el APK en la nube (GitHub) en cada push a main y bajo demanda.
# Así se obtiene un APK instalable sin tener Flutter en la máquina, y de paso
# se verifica que el proyecto compile.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar (informativo, no bloquea)
        run: flutter analyze || true

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sigot-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
